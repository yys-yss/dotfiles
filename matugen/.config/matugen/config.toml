[config]

[config.wallpaper]
# Whether to set the wallpaper or not
set = true

command = "awww img --transition-type wipe {{ image }} --transition-fps 240 --transition-duration 1"

[templates.matuwall]
input_path = '~/.config/matugen/templates/matuwall-colors.json'
output_path = '~/.config/matuwall/colors.json'

[templates.waybar]
input_path = '~/.config/matugen/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = "bash ~/.config/waybar/scripts/launch.sh"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua' # If using lua config replace *.conf* with *.lua* at the end

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/colors.conf' # If using lua config replace *.conf* with *.lua* at the end

[templates.neovim]
input_path = '~/.config/matugen/templates/nvim-colors.json'
output_path = '~/.config/nvim/generated-colors.json'
# post_hook = 'pkill -SIGUSR1 nvim'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors/matugen.rasi'

[templates.waypaper]
input_path = '~/.config/matugen/colors.css'
output_path = '~/.config/waypaper/colors.css'

[templates.zen-websites]
input_path = '~/.config/matugen/templates/firefox-colors.css'
output_path = '~/.config/zen/ybwtz3eg.Default (release)/chrome/colors.css'

[templates.zen-browser]
input_path = '~/.config/matugen/templates/zen-browser-colors.css'
output_path = '~/.config/zen/ybwtz3eg.Default (release)/chrome/userChrome.css'

